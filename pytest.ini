[pytest]
testpaths = tests
pythonpath = .
# Deliberately NOT a blanket `ignore::DeprecationWarning`. That blanket ignore
# is what would have hidden Streamlit telling us `use_container_width` is on
# its way out — a warning that, unheeded, breaks the whole site on the next
# Community Cloud rebuild with no code change of ours. If a third-party
# package ever becomes noisy here, silence that package by module rather than
# restoring the blanket.
filterwarnings =
    default::DeprecationWarning
